<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="certGrad" x1="10" y1="4" x2="38" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>
    <filter id="shadow" x="20" y="20" width="26" height="26" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Certificate Paper with Folded Corner -->
  <path 
    d="M10 8C10 5.79 11.79 4 14 4H27L38 15V40C38 42.21 36.21 44 34 44H14C11.79 44 10 42.21 10 40V8Z" 
    fill="#FFFFFF" 
    stroke="#0D9488" 
    stroke-width="3" 
    stroke-linejoin="round"
  />

  <!-- Top-Right Corner Fold -->
  <path 
    d="M27 4V15H38" 
    fill="#CCFBF1" 
    stroke="#0D9488" 
    stroke-width="3" 
    stroke-linejoin="round"
  />

  <!-- Content Lines on Certificate -->
  <path d="M17 21H29" stroke="#0D9488" stroke-width="2.8" stroke-linecap="round" />
  <path d="M17 27H24" stroke="#0D9488" stroke-width="2.8" stroke-linecap="round" />

  <!-- Verification Seal Badge -->
  <g filter="url(#shadow)">
    <!-- Rosette / Seal Circle -->
    <circle cx="33" cy="33" r="10.5" fill="url(#badgeGrad)" stroke="#14B8A6" stroke-width="1.8" />
    <!-- White Certified Checkmark -->
    <path 
      d="M29 33L31.8 35.8L37 30.2" 
      fill="none" 
      stroke="#FFFFFF" 
      stroke-width="2.5" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
  </g>
</svg>